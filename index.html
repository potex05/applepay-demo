<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apple Pay Demo</title>
<style>
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        background-color: #f5f5f7;
    }
    .container {
        text-align: center;
        background: white;
        padding: 30px;
        border-radius: 20px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        max-width: 400px;
        width: 90%;
    }
    h1 {
        font-size: 20px;
        margin-bottom: 20px;
        color: #1d1d1f;
    }
    .amount-input {
        font-size: 28px;
        font-weight: bold;
        text-align: center;
        border: none;
        border-bottom: 2px solid #0071e3;
        width: 80%;
        margin-bottom: 30px;
        outline: none;
        padding: 5px;
    }
    .apple-pay-button {
        -webkit-appearance: -apple-pay-button;
        -apple-pay-button-type: check-out;
        -apple-pay-button-style: black;
        display: inline-block;
        width: 100%;
        min-height: 48px;
        border-radius: 4px;
        cursor: pointer;
    }
    .status {
        margin-top: 20px;
        font-size: 14px;
        color: #86868b;
        min-height: 20px;
    }
</style>
</head>
<body>
<div class="container">
<h1>Apple Pay Demo</h1>
<p style="font-size: 12px; color: #ff3b30; margin-bottom: 10px;">※実際の請求は発生しません。</p>
<div>
<span style="font-size: 24px; font-weight: bold;">¥</span>
<input type="number" id="amount" class="amount-input" value="1000" min="1">
</div>

<!-- Apple Pay ボタン -->
<div id="apple-pay-container">
<button class="apple-pay-button" onclick="onApplePayButtonClicked()"></button>
</div>
<div id="status" class="status">金額を入力してボタンを押してください</div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    // 1. HTTP接続チェック
    if (window.location.protocol !== 'https:' && window.location.hostname !== 'localhost') {
        document.getElementById('status').innerText = "エラー: Apple PayのテストにはHTTPS接続が必要です。";
        document.getElementById('apple-pay-container').style.display = 'none';
        return;
    }

    // 2. ApplePaySessionに対応しているか確認
    if (!window.ApplePaySession || !ApplePaySession.canMakePayments()) {
        document.getElementById('status').innerText = "お使いのブラウザ・端末はApple Pay決済に対応していないか、Walletにカードが登録されていません。";
        document.getElementById('apple-pay-container').style.display = 'none';
    }
});

async function onApplePayButtonClicked() {
    const statusDiv = document.getElementById('status');
    const amountVal = document.getElementById('amount').value;
    if (!amountVal || amountVal <= 0) {
        statusDiv.innerText = "有効な金額を入力してください。";
        return;
    }

    statusDiv.innerText = "Apple Payを起動中...";

    // ApplePaySession を使用したリクエストを作成
    const paymentRequest = {
        countryCode: 'JP',
        currencyCode: 'JPY',
        supportedNetworks: ['visa', 'masterCard', 'amex', 'jcb'],
        merchantCapabilities: ['supports3DS'],
        total: {
            label: 'デモオンラインショップ',
            amount: amountVal
        }
    };

    // バージョン3を指定してセッション開始
    const session = new ApplePaySession(3, paymentRequest);

    // マーチャント認証イベント（本番ではサーバーサイド処理が必要）
    session.onvalidatemerchant = async (event) => {
        /*
          【注意】本来はここでサーバーに `event.validationURL` を送り、
          Apple Merchant API と通信してマーチャントセッションを取得します。
          フロントエンド単体（ダミー）ではここで失敗します。
        */
        console.log("Validation URL:", event.validationURL);
        statusDiv.innerText = "マーチャント認証中（要サーバー処理）...";
    };

    // ユーザー認証成功時
    session.onpaymentauthorized = (event) => {
        // 決済処理結果を返す
        session.completePayment(ApplePaySession.STATUS_SUCCESS);
        statusDiv.innerHTML = `<span style="color: #34c759; font-weight: bold;">決済デモ成功！</span><br>金額:¥${Number(amountVal).toLocaleString()}`;
    };

    // キャンセル時
    session.oncancel = (event) => {
        statusDiv.innerText = "ユーザーによって決済がキャンセルされました。";
    };

    // セッション開始
    session.begin();
}
</script>
</body>
</html>
